{{/* Interactive map of ALC chapters, built from the front matter of
     pages under /alc/chapters/. Loads Leaflet from CDN, map page only. */}}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div id="alc-map" style="height: 460px; margin: 1em 0; border: 1px solid #ddd; border-radius: 4px;"></div>

<script>
(function () {
  {{- $chapters := slice }}
  {{- range (where (where .Site.RegularPages "Section" "alc") "Params.lat" "!=" nil) }}
    {{- $chapters = $chapters | append (dict
          "name"    .Title
          "city"    (.Params.city | default .Title)
          "country" (.Params.country | default "")
          "lat"     .Params.lat
          "lon"     .Params.lon
          "status"  (.Params.status | default "active")
          "url"     .RelPermalink
    ) }}
  {{- end }}
  var chapters = {{ $chapters | jsonify | safeJS }};

  var map = L.map('alc-map').setView([20, 10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var colors = { active: "#4caf50", proposed: "#ff9800", dissolved: "#9e9e9e" };
  var bounds = [];
  chapters.forEach(function (c) {
    var color = colors[c.status] || "#4caf50";
    var marker = L.circleMarker([c.lat, c.lon], {
      radius: 8, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.9
    }).addTo(map);
    var label = c.country ? (c.city + ", " + c.country) : c.city;

    // Build the popup as real DOM nodes so the link navigates normally.
    // (A string-concatenated <a> inside bindPopup can have its click
    // swallowed by Leaflet, which just re-centers the map instead of
    // following the href.)
    var container = document.createElement("div");
    var heading = document.createElement("strong");
    var link = document.createElement("a");
    link.href = c.url;
    link.textContent = c.name;
    heading.appendChild(link);
    container.appendChild(heading);
    container.appendChild(document.createElement("br"));
    container.appendChild(document.createTextNode(label));
    container.appendChild(document.createElement("br"));
    var em = document.createElement("em");
    em.textContent = c.status;
    container.appendChild(em);

    marker.bindPopup(container);
    bounds.push([c.lat, c.lon]);
  });
  if (bounds.length) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 5 }); }

  // Status legend (bottom-right), using the same colors as the markers.
  var legend = L.control({ position: "bottomright" });
  legend.onAdd = function () {
    var div = L.DomUtil.create("div", "alc-legend");
    div.style.background = "rgba(255,255,255,0.9)";
    div.style.padding = "6px 8px";
    div.style.borderRadius = "4px";
    div.style.font = "12px/1.4 sans-serif";
    div.style.boxShadow = "0 1px 4px rgba(0,0,0,0.3)";
    var items = [
      ["active",    "Active"],
      ["proposed",  "Proposed"],
      ["dissolved", "Dissolved"]
    ];
    var html = "";
    items.forEach(function (it) {
      html += '<div style="display:flex;align-items:center;margin:2px 0;">' +
              '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;' +
              'background:' + colors[it[0]] + ';border:2px solid #fff;' +
              'box-shadow:0 0 1px #999;margin-right:6px;"></span>' + it[1] + '</div>';
    });
    div.innerHTML = html;
    return div;
  };
  legend.addTo(map);
})();
</script>
